<details class="info-fold" id="about"><summary><span class="fold-title">About the office</span><span class="fold-mark" aria-hidden="true">+</span></summary><div class="fold-body"><p>Left Luggage is a self-contained browser puzzle experience inspired by an old railway lost-property counter. Explore 44 numbered bags, solve their clues and uncover the odd objects the clerk has kept on the shelves. It is a small independent web project, built to be played directly in your browser.</p></div></details>

<div class="tile"><strong>Clerk hints</strong><p>Ask for a nudge when a tag has you stumped.</p></div>
<div class="tile"><strong>Four themes</strong><p>Choose Night Shift, Day Shift, Archive or Signal Room from the counter controls.</p></div>

</div><p class="smallprint">There are no physical products for sale, paid plans, subscriptions or booking services on this site. The “showcase” is the free interactive experience itself.</p></div></details>

<details><summary>How do I play?</summary><p>Select any numbered bag on the rack, read its tag and enter the answer. Some puzzles require you to inspect the page or interact with your browser. Use “Ask the clerk” for a hint.</p></details>
<details><summary>How many puzzles are there?</summary><p>There are 44 bags to claim.</p></details>
<details><summary>Is it free?</summary><p>Yes. The experience is free to play and does not require an account or payment.</p></details>
<details><summary>Does my progress carry between devices?</summary><p>No. Progress is saved in local browser storage on the device and browser you use. It does not sync to an account.</p></details>

<h3>Information this site stores</h3><p>Left Luggage stores puzzle answers/claimed-bag progress under the browser storage key <code>lug1</code> and the selected colour theme under <code>left-luggage-theme</code>. This information remains in your browser's local storage and is not sent to a Left Luggage application server.</p>
<h3>Accounts and contact forms</h3><p>This site does not provide account registration, a newsletter or an on-site contact form. If you contact the project through GitHub, GitHub processes that interaction under its own privacy terms.</p>
<h3>Third-party services</h3><p>The page loads typefaces from Google Fonts. Your browser may connect to Google's servers to retrieve those font files; Google's own policies govern that service. GitHub Pages hosts the website and may process standard hosting and security logs under GitHub's policies.</p>
<h3>Your choices</h3><p>You can clear this site's local storage through your browser settings. This removes saved progress and theme preferences. You can also use browser controls or extensions to limit third-party requests, though the page may then use system fonts.</p>
<h3>Children and sensitive information</h3><p>Do not enter personal, financial, health or other sensitive information into puzzle answers. The answer field is for puzzle responses only.</p>
<h3>Policy changes</h3><p>If the site's data practices change, this policy should be updated before the change takes effect.</p></div></details>
